      <main id="mainsection">
         <article id="articleContainer">
            <h2>Contact Us</h2>
            <h3>We would love to hear from you.</h3>
            <form id="contact"
                  action="https://formsubmit.co/43341f833cfe78a658001456e0a0e10b"
                  method="post">

               <!-- FormSubmit.co configuration (hidden) -->
               <input type="hidden" name="_subject"
                      value="New contact form submission - edmonizphotography.com">
               <input type="hidden" name="_template" value="table">
               <input type="hidden" name="_next"
                      value="https://edmonizphotography.com/thankyou.html">
               <input type="hidden" name="_captcha" value="false">
               <!-- Honeypot: bots fill this, humans never see or tab to it -->
               <input type="text" name="_honey" tabindex="-1" autocomplete="off"
                      aria-hidden="true" style="display:none !important">

            <fieldset id="cust_info">
               <legend>Contact Information</legend>
               <p>Required Items (*)</p>
               <div class="formRow">
                  <label for="fname">First Name*</label>
                  <input name="First Name" id="fname" type="text" required>
               </div>
               <div class="formRow">
                  <label for="lname">Last Name*</label>
                  <input name="Last Name" id="lname" type="text" required>
               </div>
               <div class="formRow">
                  <label for="street">Street Address</label>
                  <input name="Street Address" id="street" type="text">
               </div>
               <div class="formRow">
                  <label for="province">Province</label>
                  <input name="Province" id="province" type="text">
               </div>
               <div class="formRow">
                  <label for="postal">Postal Code*</label>
                  <input name="Postal Code" id="postal" type="text"
                   required
                   pattern="[a-zA-Z]\d[a-zA-Z]\s?\d[a-zA-Z]\d"
                   oninput="this.value = this.value.toUpperCase()">
               </div>
               <div class="formRow">
                  <label for="phone">Phone Number*</label>
                  <input name="Phone" id="phone" type="tel"
                     placeholder="(nnn) nnn-nnnn"
                     required
                     pattern="\d{3}\s\d{3}-\d{4}"
                     autocomplete="off">
               </div>

               <div class="formRow">
                  <label for="mail">E-mail*</label>
                  <input name="Email" id="mail" type="email" required
                        placeholder="name@example.com">
               </div>
            </fieldset>
            <fieldset>
               <legend>Tell Us About Yourself</legend>
               <div class="formRow">
                  <label for="group">Interests</label>
                  <select name="Interest" id="group">
                     <option value="">select interest</option>
                     <option value="Colour">Colour</option>
                     <option value="Black and White">Black and White</option>
                     <option value="Studio Lighting">Studio Lighting</option>
                     <option value="Night Photography">Night Photography</option>
                     <option value="Film Photography">Film Photography</option>
                  </select>
               </div>
               <div class="formRow">
                  <label for="group2">Experience</label>
                  <select name="Experience" id="group2">
                     <option value="">select experience</option>
                     <option value="Novice">Novice</option>
                     <option value="Enthusiast">Enthusiast</option>
                     <option value="Advanced Amateur">Advanced Amateur</option>
                     <option value="Professional">Professional</option>
                     <option value="Working Photographer">Working Photographer</option>
                  </select>
               </div>
               <div class="formRow">
                  <label for="workshop">Would you attend a photography workshop?</label>
                  <input type="checkbox" name="Would Attend Workshop" value="Yes" id="workshop">
               </div>
               <div class="formRow">
                  <label for="contactme">Contact me please</label>
                  <input type="checkbox" name="Wants To Be Contacted" value="Yes" id="contactme">
               </div>

               <div class="formRow">
                  <label for="info">How can we assist you on your photographic journey?</label>
                  <textarea name="Message" id="info"></textarea>
               </div>
               <div class="buttons">
                  <input id="submitButton" value="Submit" type="submit">
                  <input id="resetButton" value="Cancel" type="reset">               
               </div>
            </fieldset>
