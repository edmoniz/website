<!DOCTYPE html>
<html>
<head>
 <title>New Year Alert</title>
</head>
<style>
  .buttons  {
    border: 2px solid black;
    margin: 0 auto;

  }
</style>

<body>

 <h1>New Year's Message</h1>
 <p>Click OK to continue.</p>


<h2 id="hello">hello world</h2>
 <button id="myButton">Click Me</button>

</body>

<p id="output"></p>

<img id="image" src="" alt="">

<script>
  const myButton = document.getElementById('myButton');
    myButton.addEventListener('click', function() {
    const myParagraph = document.getElementById('hello');

    myParagraph.textContent = "the button was pressed";
    myParagraph.style.color = 'blue';
    myButton.style.backgroundColor = 'blue';
    myButton.style.color = 'white';
    myButton.innerHTML = 'Who Pressed Me.';

    const myArray = ["mon", "tue", "wed"];
    const outputElement = document.getElementById('output')

    let htmlString = "<ul>";
    myArray.forEach(element => {
      htmlString += `<li>${element}</li>`;
    });
    htmlString += "</ul>";
    outputElement.innerHTML = htmlString;

    const myImage = document.getElementById("image");
    myImage.src = "image.png";

  })

</script>
</html>
